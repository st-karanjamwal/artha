# Host nginx server block for Artha (EC2). Copy to /etc/nginx/sites-available/artha.conf,
# replace artha.example.com, symlink into sites-enabled, then: sudo certbot --nginx -d artha.example.com
# The Artha web container listens on 127.0.0.1:8080 (ARTHA_WEB_PORT).

limit_req_zone $binary_remote_addr zone=artha_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name artha.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name artha.example.com;

    # Managed by certbot:
    ssl_certificate     /etc/letsencrypt/live/artha.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artha.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 80m;   # vault blob (+ headroom)

    # Brute-force damping in front of the app's own lockout.
    location /api/auth/ {
        limit_req zone=artha_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

[project]
name = "artha-backend"
version = "0.1.0"
description = "Artha storage/auth/backup server. Handles opaque encrypted blobs only."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "segno>=1.6",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "cryptography>=43"]
# Offline recovery tool (scripts/decrypt_vault.py) — not needed by the server.
tools = ["cryptography>=43"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
